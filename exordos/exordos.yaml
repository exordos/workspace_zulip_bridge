build:
  deps:
    - dst: /opt/workspace_zulip_bridge
      path:
        src: ../../workspace_zulip_bridge
      exclude:
        - .git
        - .mypy_cache
        - .pytest_cache
        - .ruff_cache
        - .tox
        - .venv
        - build
        - dist
        - output

  elements:
    - manifest: manifests/workspace_zulip_bridge.yaml.j2
      images:
        - name: workspace-zulip-bridge
          format: zst
          profile: exordos_base
          profile_version: "1.2.1"
          script: images/install.sh
          override:
            disk_size: "6G"
