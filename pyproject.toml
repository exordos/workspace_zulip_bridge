[project]
name = "workspace-zulip-bridge"
description = "Low-latency Workspace and Zulip integration bridge"
readme = "README.md"
authors = [{name = "Genesis Corporation", email = "cassi@exordos.com"}]
dynamic = ["version"]
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
classifiers = [
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "asyncpg>=0.31.0,<1.0.0",  # Apache-2.0
    "httpx>=0.28.1,<1.0.0",  # BSD-3-Clause
    "uvloop>=0.22.1,<1.0.0; python_version < '3.14'",  # MIT OR Apache-2.0
]

[project.urls]
homepage = "https://github.com/exordos/workspace_zulip_bridge/"

[project.scripts]
workspace-zulip-bridge = "workspace_zulip_bridge.cli:main"
workspace-zulip-bridge-monitor = "workspace_zulip_bridge.monitor:main"

[project.optional-dependencies]
dev = [
    "tox>=4.58.0,<5.0.0",
    "tox-uv>=1.29.0,<2.0.0",
]
test = [
    "Jinja2>=3.1.0,<4.0.0",
    "PyYAML>=6.0.0,<7.0.0",
    "pytest>=8.0.0,<10.0.0",
]
mypy = [
    "asyncpg-stubs>=0.31.3,<1.0.0",
    "mypy>=1.18.0,<2.0.0",
]
ruff = [
    "ruff>=0.13.0,<1.0.0",
]

[build-system]
requires = [
    "setuptools>=83.0.0",
    "setuptools-scm>=10.0.0",
]
build-backend = "setuptools.build_meta"

[tool.setuptools_scm]
fallback_version = "0.1.0.dev0"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["."]
include = ["workspace_zulip_bridge"]
namespaces = false

[tool.setuptools.package-data]
workspace_zulip_bridge = ["schema.sql"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["ASYNC", "B", "E4", "E7", "E9", "F", "I", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["workspace_zulip_bridge"]
force-single-line = true

[tool.mypy]
python_version = "3.12"
strict = true
exclude = ["workspace_zulip_bridge/tests"]

[[tool.mypy.overrides]]
module = "uvloop"
ignore_missing_imports = true
