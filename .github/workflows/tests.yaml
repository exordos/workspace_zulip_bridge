name: tests

on:
  pull_request:
  push:
    branches: [master]

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    services:
      postgresql:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: workspace_zulip_bridge_test
          POSTGRES_USER: workspace_zulip_bridge_test
          POSTGRES_PASSWORD: test-only
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install "tox>=4.58,<5" "tox-uv>=1.29,<2"
      - run: tox -e py
        env:
          WZB_TEST_DATABASE_DSN: >-
            postgresql://workspace_zulip_bridge_test:test-only@127.0.0.1:5432/workspace_zulip_bridge_test

  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "tox>=4.58,<5" "tox-uv>=1.29,<2"
      - run: tox -e ruff,mypy
